[package]
name = "webdist-desktop"
version = "1.0.0"
description = "WEB DISTRIBUIDORA - aplicacao desktop"
authors = ["WEB DISTRIBUIDORA"]
edition = "2021"
rust-version = "1.77"

# O nome da lib precisa ser unico e em snake_case para o Tauri's
# empacotamento no Windows (o .exe usa o campo `name` acima).
[lib]
name = "webdist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
# O bundle desktop é embarcado; otimizar tamanho compensa.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
